[project]
name = "minavio"
version = "0.1.0"
description = "Moteur de montage automatique hybride (LLM local + FFmpeg/OpenCV + motion design)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "pillow>=10",  # miniatures (repli sans Node), recadrage des captures
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.9", "mediapipe>=0.10", "scenedetect>=0.7"]
audio = ["librosa>=0.10", "silero-vad>=5.1", "onnxruntime>=1.18"]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.18"]
asr = ["faster-whisper>=1.0"]
hype = ["panns-inference>=0.1", "torch>=2.3"]
ui = ["gradio>=6,<7"]
cloud = ["anthropic>=1"]
all = ["minavio[vision,audio,ocr,asr,hype,ui,cloud]"]

[project.scripts]
minavio = "minavio.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minavio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
