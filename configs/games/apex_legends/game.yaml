# Nouveau jeu = copier ce dossier, changer les templates. Aucun code à écrire.
id: apex_legends
name: Apex Legends
genre: battle_royale
modes: [pvp, coop]  # trios en ligne
combo_window_s: 6.0
# Lecture OCR du killfeed : aucune capture à fournir. roi: null = zone trouvée automatiquement
# (la ROI trouvée est loguée en info : la recopier ici pour sauter l'auto-localisation).
killfeed:
  roi: null
  player_names: []   # votre pseudo (sinon tous les kills sont comptés comme les vôtres)
  keywords:
    kill:
      - eliminated
      - éliminé
      - killed
      - a tué
      - headshot
    knock:
      - knocked down
      - a mis à terre
      - mis à terre
      - à terre
      - downed
    win:
      - champion de l'arène
      - champions of the arena
      - champion
      - victoire
      - victory
ui_templates:
  - name: kill_marker
    image: templates/kill_marker.png   # crop du marqueur de kill (à fournir)
    label: kill
    roi: [0.40, 0.35, 0.20, 0.30]
    threshold: 0.82
    cooldown_s: 0.8
  - name: knockdown_banner
    image: templates/knockdown.png
    label: knock
    roi: [0.30, 0.15, 0.40, 0.15]
    threshold: 0.80
  - name: champion_banner
    image: templates/champion.png
    label: win
    roi: [0.20, 0.30, 0.60, 0.40]
    threshold: 0.75
    cooldown_s: 30
