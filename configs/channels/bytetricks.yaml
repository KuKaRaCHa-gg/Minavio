# Profil de chaîne (schéma : `minavio schema`, validation : `minavio profiles validate`).
# Champs clés :
#   games      ids de configs/games/<id>/ utilisés par le détecteur template_match.
#   outputs    formats rendus (name, aspect, résolution, fps, reframe, max_duration_s) ;
#              sélectionnables avec `minavio run --format <name|aspect>`.
#   detection  détecteurs et poids (weight) qui pondèrent le score des highlights.
#   audio      music_dir (musique choisie de façon déterministe), beat_sync, loudness, ducking.
#   llm        prompt (fichier de src/minavio/llm/prompts/), max_highlights ;
#              base_url/model surchargés par MINAVIO_LLM_BASE_URL / MINAVIO_LLM_MODEL.
#   motion     theme (couleurs, fonte), templates Remotion, style des sous-titres mot-à-mot.
#   editing    pacing, durée cible, bornes de clip, pre/post-roll autour de chaque moment ;
#              editing.autocut coupe les silences (et recale la coupe sur le rythme de parole).
#   framing    smoothing : lissage du suivi de cadrage (reframe face_track / action_track) ;
#              facecam : détection et découpe de la facecam pour reframe split_facecam.
#   Référence des blocs et détecteurs : configs/README.md.
id: bytetricks
display_name: Byte Tricks
content_type: tech_facts
description: Fun facts tech, anecdotes d'ingénierie et de software.

outputs:
  - { name: youtube, aspect: "16:9", width: 1920, height: 1080, fps: 30, reframe: none }
  - { name: shorts, aspect: "9:16", width: 1080, height: 1920, fps: 30, reframe: blur_pad, max_duration_s: 59 }

detection:
  - { name: speech, weight: 1.0 }                # le fil narratif vient de la voix
  - { name: scene_change, weight: 0.5, params: { threshold: 0.35 } }
  - { name: hype, weight: 0.5 }                  # pics d'intensité vocale/audio combinés
  - { name: vision_scan, weight: 0.5 }           # le LLM vision repère les schémas/écrans parlants

audio:
  music_dir: assets/music/bytetricks
  beat_sync: true
  loudness_lufs: -14
  ducking: { enabled: true, music_gain_db: -20 }
  denoise: { enabled: true }                     # voix : ventilo, clavier

llm:
  prompt: tech_facts
  max_highlights: 6

motion:
  theme: { primary: "#0A84FF", accent: "#30D158", font: "Press Start 2P" }
  templates: [title, popup, progress_bar, captions]
  captions: { enabled: true, word_by_word: true, position: bottom, style: pixel }

editing:
  pacing: dynamic
  target_duration_s: 300
  min_clip_s: 1.5
  max_clip_s: 12
  pre_roll_s: 0.3
  post_roll_s: 0.3
  autocut: { enabled: true, min_silence_s: 0.5, punch_in: 1.08 }  # coupe les silences

# Miniatures (voir configs/README.md).
thumbnails: { enabled: true, count: 3, layouts: [hero, split], max_words: 4 }

# Publication YouTube : jamais automatique (`minavio publish bytetricks <job>`).
publish: { category_id: "28" }  # 28 = Science & Technology
